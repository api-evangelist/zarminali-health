name: Zarminali Health
description: >-
  Zarminali Health (Zarminali Pediatrics) is a pediatric healthcare provider
  building a new standard for children's care through purpose-built clinics that
  support families from newborn care through young adulthood. Its services span
  primary care, urgent care, telehealth, and specialty pediatric care, with
  clinics expanding across Michigan, Minnesota, Georgia, Illinois, Maryland,
  Wisconsin, and Tennessee. Patient access is delivered through an AthenaHealth
  patient portal rather than a public developer platform. As a clinical care
  delivery organization, Zarminali Health publishes no public API, developer
  portal, OpenAPI specification, SDKs, or machine-readable developer surface at
  this time. It was surfaced as a General Catalyst portfolio company and added
  to the API Evangelist network as a lead; this enrichment pass confirmed there
  is currently no public API surface to catalog.
